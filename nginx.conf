worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 7860;
        server_name _;
        client_max_body_size 50m;

        # 1. 钥匙入口：在网址后面加 /baixiao，自动下发通行 Cookie 并跳转进入控制台
        # （语法合规：add_header 写在 location 中，彻底消除 emerg 报错）
        location /baixiao {
            add_header Set-Cookie "access_token=baixiao_pass; Path=/; Max-Age=2592000; HttpOnly" always;
            return 302 /;
        }

        # 2. 对外大模型 API 接口 (/v1/)，客户端直连放行
        location /v1/ {
            proxy_pass http://127.0.0.1:7862/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
        }

        # 3. 核心分流逻辑：
        # - 普通人无通行证：展示环保宣传页面
        # - 你访问过 /baixiao 带通行证：100% 按照你原始代码的直通模式反代（绝不报 405）
        location / {
            if ($cookie_access_token != "baixiao_pass") {
                rewrite ^ /_static_landing_page last;
            }

            proxy_pass http://127.0.0.1:7862;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
        }

        # 4. 环保静态页专属内部路由
        location = /_static_landing_page {
            internal;
            root /var/www/html;
            try_files /index.html =404;
        }
    }
}
