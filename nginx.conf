worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    server {
        listen 7860;
        server_name _;
        client_max_body_size 50m;

        # 1. 伪装入口：访问 /baixiao 进入管理控制台
        location = /baixiao {
            return 301 /baixiao/;
        }
        location /baixiao/ {
            proxy_pass http://127.0.0.1:7862/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 2. 核心修复：放行控制台读取数据必需的 API 路由与静态资源
        # 否则前端请求 /v0/management 会拿到环保页 HTML，导致前端显示全空
        location ~ ^/(v0|management|assets|static|api)/ {
            proxy_pass http://127.0.0.1:7862;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
        }

        # 3. 对外大模型 API 转发接口 (/v1/)
        location /v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://127.0.0.1:7862/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # 4. 根路径展示环保宣传页（仅直接访问首页时展示）
        location = / {
            root /var/www/html;
            index index.html;
        }

        location / {
            root /var/www/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
