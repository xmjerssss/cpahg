worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    server {
        listen 7860;
        server_name _;
        client_max_body_size 50m;

        # 1. 管理后台数据接口（允许 GET/POST/PUT/DELETE 保存配置）
        location /v0/ {
            proxy_pass http://127.0.0.1:7862/v0/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
        }

        # 2. 对外大模型 API 接口
        location /v1/ {
            proxy_pass http://127.0.0.1:7862/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
        }

        # 3. 控制台静态资源目录
        location /management/ {
            proxy_pass http://127.0.0.1:7862/management/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /assets/ {
            proxy_pass http://127.0.0.1:7862/assets/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /static/ {
            proxy_pass http://127.0.0.1:7862/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. 伪装入口：访问 /baixiao 进入控制台页面
        location = /baixiao {
            return 301 /baixiao/;
        }
        location /baixiao/ {
            proxy_pass http://127.0.0.1:7862/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 5. 根路径展示环保宣传页
        location = / {
            root /var/www/html;
            index index.html;
        }

        location / {
            root /var/www/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
