worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 128;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # 1. 检查访问者是否带有通行通行证 Cookie
    map $cookie_access_token $is_authorized {
        default 0;
        "baixiao_secret_pass" 1;
    }

    server {
        listen 7860;
        server_name _;
        client_max_body_size 50m;

        # 2. 暗号激活入口：访问 /?pass=baixiao 自动激活并下发通行证
        if ($arg_pass = "baixiao") {
            add_header Set-Cookie "access_token=baixiao_secret_pass; Path=/; Max-Age=2592000; HttpOnly";
            return 302 /;
        }

        # 3. 对外调用 API 接口 (/v1/)，客户端直连放行
        location /v1/ {
            proxy_pass http://127.0.0.1:7862/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_buffering off;
        }

        # 4. 核心分流逻辑：
        # - 携带通行证：全量放行给后端（和你的原始代码 100% 一模一样，绝不产生路由冲突）
        # - 未授权访客：一律展示环保静态页面
        location / {
            if ($is_authorized = 1) {
                proxy_pass http://127.0.0.1:7862;
                break;
            }

            root /var/www/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
